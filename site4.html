<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>わやたに | COSMOS DRIFT 360 FULL</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root { --white: #ffffff; --black: #000000; --ui-font: 'Helvetica Neue', Arial, sans-serif; }
        body { margin: 0; background: var(--black); overflow: hidden; font-family: var(--ui-font); cursor: grab; }
        body:active { cursor: grabbing; }
        #ui-header { position: fixed; top: 40px; left: 40px; z-index: 100; pointer-events: none; }
        .logo { font-size: 24px; font-weight: 900; border: 2px solid var(--white); padding: 5px 15px; color: var(--white); background: transparent; display: inline-block; pointer-events: auto; text-decoration: none; letter-spacing: -1px; }
        .status { position: fixed; bottom: 20px; left: 20px; font-family: monospace; font-size: 9px; color: var(--white); opacity: 0.5; pointer-events: none; text-transform: uppercase; letter-spacing: 1px;}
    </style>
</head>
<body>

    <div id="ui-header">
        <a href="index.html" class="logo">わやたに</a>
    </div>

    <div class="status">CONTROL: ACTIVE_DRAG // MODE: FULL_360_VIEW // ENTITY: GIANT_GLB</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, clock;
        let objects = [];
        let particles;
        
        let isDragging = false;
        let lon = 0, lat = 0;
        let targetLon = 0, targetLat = 0; 
        let phi = 0, theta = 0;
        let pointerX = 0, pointerY = 0;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.0006);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 4000);
            camera.position.set(0, 0, 500);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const pointLight = new THREE.PointLight(0xffffff, 1500, 1000);
            camera.add(pointLight); 
            scene.add(camera);

            const partGeom = new THREE.BufferGeometry();
            const partPos = [];
            for (let i = 0; i < 10000; i++) {
                partPos.push(THREE.MathUtils.randFloatSpread(4000));
                partPos.push(THREE.MathUtils.randFloatSpread(4000));
                partPos.push(THREE.MathUtils.randFloatSpread(4000));
            }
            partGeom.setAttribute('position', new THREE.Float32BufferAttribute(partPos, 3));
            particles = new THREE.Points(partGeom, new THREE.PointsMaterial({ color: 0xffffff, size: 2, transparent: true, opacity: 0.6 }));
            scene.add(particles);

            const loader = new GLTFLoader();
            loader.load('char.glb', (gltf) => {
                const masterModel = gltf.scene;
                for (let i = 0; i < 40; i++) {
                    const instance = masterModel.clone();
                    instance.position.set(
                        THREE.MathUtils.randFloatSpread(3000),
                        THREE.MathUtils.randFloatSpread(3000),
                        THREE.MathUtils.randFloatSpread(3000)
                    );
                    instance.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
                    
                    // --- GLBの大きさを調整（30倍に拡大） ---
                    // もしこれでも小さい場合は数値を上げてください
                    const s = 25 + Math.random() * 10;
                    instance.scale.set(s, s, s);
                    
                    scene.add(instance);
                    objects.push(instance);
                }
            }, undefined, (err) => console.log("GLB load error."));

            document.addEventListener('pointerdown', (e) => {
                isDragging = true;
                pointerX = e.clientX;
                pointerY = e.clientY;
            });

            document.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - pointerX;
                const deltaY = e.clientY - pointerY;

                // --- 修正ポイント：ドラッグの感度を大幅に強化 ---
                // これでシームレスに全方位（左右）を見回せます
                targetLon -= deltaX * 0.4; 
                targetLat -= deltaY * 0.3;

                pointerX = e.clientX;
                pointerY = e.clientY;
            });

            document.addEventListener('pointerup', () => {
                isDragging = false;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // --- 滑らかさ（Lerp）の追従速度も少し上げる ---
            lon += (targetLon - lon) * 0.15; 
            lat += (targetLat - lat) * 0.15;
            
            // --- 画面の逆さまを防止する上下制限 ---
            // 上下も無限に回したい場合はここを外しますが、逆さまになります
            lat = Math.max(-85, Math.min(85, lat)); 

            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            const target = new THREE.Vector3();
            target.setFromSphericalCoords(1, phi, theta).add(camera.position);
            camera.lookAt(target);

            // --- 進行方向へ進む ---
            camera.getWorldDirection(new THREE.Vector3()); // dummy for update
            const moveSpeed = 1.8;
            const direction = camera.getWorldDirection(new THREE.Vector3());
            camera.position.add(direction.multiplyScalar(moveSpeed));

            // --- オブジェクトのループ（転生）ロジック ---
            objects.forEach(obj => {
                obj.rotation.y += 0.003;
                obj.rotation.z += 0.001;

                if (obj.position.distanceTo(camera.position) > 2500) {
                    const forward = camera.getWorldDirection(new THREE.Vector3());
                    // 巨大モデルなので、カメラから少し遠くに配置
                    obj.position.copy(camera.position).add(forward.multiplyScalar(2000));
                    
                    obj.position.x += THREE.MathUtils.randFloatSpread(3000);
                    obj.position.y += THREE.MathUtils.randFloatSpread(3000);
                    obj.position.z += THREE.MathUtils.randFloatSpread(500);
                }
            });

            if (particles) {
                particles.rotation.y += 0.0001;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
