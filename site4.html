<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>わやたに | COSMOS DRIFT 360</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root { --white: #ffffff; --black: #000000; --ui-font: 'Helvetica Neue', Arial, sans-serif; }
        body { margin: 0; background: var(--black); overflow: hidden; font-family: var(--ui-font); cursor: grab; }
        body:active { cursor: grabbing; }
        #ui-header { position: fixed; top: 40px; left: 40px; z-index: 100; pointer-events: none; }
        .logo { font-size: 24px; font-weight: 900; border: 2px solid var(--white); padding: 5px 15px; color: var(--white); background: transparent; display: inline-block; pointer-events: auto; text-decoration: none; letter-spacing: -1px; }
        .status { position: fixed; bottom: 20px; left: 20px; font-family: monospace; font-size: 9px; color: var(--white); opacity: 0.5; pointer-events: none; text-transform: uppercase; letter-spacing: 1px;}
    </style>
</head>
<body>

    <div id="ui-header">
        <a href="index.html" class="logo">わやたに</a>
    </div>

    <div class="status">CONTROL: MOUSE_DRAG // MODE: 360_VIEW // ENTITY: INFINITE_LOOP</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, clock;
        let objects = [];
        let particles;
        
        // 視点操作用の変数
        let isDragging = false;
        let lon = 0, lat = 0; // 経度と緯度
        let phi = 0, theta = 0; // 計算用
        let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
        let onPointerDownLon = 0, onPointerDownLat = 0;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.001);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // ライト
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const pointLight = new THREE.PointLight(0xffffff, 1000);
            camera.add(pointLight); // カメラ追従ライト
            scene.add(camera);

            // 星屑
            const partGeom = new THREE.BufferGeometry();
            const partPos = [];
            for (let i = 0; i < 8000; i++) {
                partPos.push(THREE.MathUtils.randFloatSpread(3000));
                partPos.push(THREE.MathUtils.randFloatSpread(3000));
                partPos.push(THREE.MathUtils.randFloatSpread(3000));
            }
            partGeom.setAttribute('position', new THREE.Float32BufferAttribute(partPos, 3));
            particles = new THREE.Points(partGeom, new THREE.PointsMaterial({ color: 0xffffff, size: 2 }));
            scene.add(particles);

            // GLBモデル配置
            const loader = new GLTFLoader();
            loader.load('char.glb', (gltf) => {
                const masterModel = gltf.scene;
                for (let i = 0; i < 60; i++) {
                    const instance = masterModel.clone();
                    instance.position.set(
                        THREE.MathUtils.randFloatSpread(2000),
                        THREE.MathUtils.randFloatSpread(2000),
                        THREE.MathUtils.randFloatSpread(2000)
                    );
                    instance.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
                    const s = 6 + Math.random() * 8;
                    instance.scale.set(s, s, s);
                    scene.add(instance);
                    objects.push(instance);
                }
            });

            // ドラッグ操作のイベント
            document.addEventListener('pointerdown', onPointerDown);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function onPointerDown(e) {
            isDragging = true;
            onPointerDownPointerX = e.clientX;
            onPointerDownPointerY = e.clientY;
            onPointerDownLon = lon;
            onPointerDownLat = lat;
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            // 横移動で経度、縦移動で緯度を変化させる
            lon = (onPointerDownPointerX - e.clientX) * 0.1 + onPointerDownLon;
            lat = (e.clientY - onPointerDownPointerY) * 0.1 + onPointerDownLat;
            lat = Math.max(-85, Math.min(85, lat)); // 真上・真下で反転しないように制限
        }

        function onPointerUp() {
            isDragging = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // --- カメラの前進 ---
            // 常に「向いている方向」へ少しずつ進む
            const moveSpeed = 1.5;
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            camera.position.add(direction.multiplyScalar(moveSpeed));

            // --- 360度視点更新 ---
            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            const target = new THREE.Vector3();
            target.setFromSphericalCoords(1, phi, theta).add(camera.position);
            camera.lookAt(target);

            // --- オブジェクトのループ処理 ---
            // カメラから遠ざかったオブジェクトを進行方向の先へ飛ばす
            objects.forEach(obj => {
                obj.rotation.y += 0.01;
                const dist = obj.position.distanceTo(camera.position);
                if (dist > 1500) {
                    // 通り過ぎた、あるいは離れすぎた場合、カメラの「前方」に再配置
                    const forward = new THREE.Vector3();
                    camera.getWorldDirection(forward);
                    obj.position.copy(camera.position).add(forward.multiplyScalar(1000));
                    // 少し左右上下に散らす
                    obj.position.x += THREE.MathUtils.randFloatSpread(1500);
                    obj.position.y += THREE.MathUtils.randFloatSpread(1500);
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
