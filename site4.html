<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>わやたに | COSMOS DRIFT 360 FIX</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root { --white: #ffffff; --black: #000000; --ui-font: 'Helvetica Neue', Arial, sans-serif; }
        body { margin: 0; background: var(--black); overflow: hidden; font-family: var(--ui-font); cursor: grab; }
        body:active { cursor: grabbing; }

        #ui-header { position: fixed; top: 40px; left: 40px; z-index: 100; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
        .logo { font-size: 24px; font-weight: 900; border: 2px solid var(--white); padding: 5px 15px; color: var(--white); background: transparent; display: inline-block; pointer-events: auto; text-decoration: none; letter-spacing: -1px; }
        
        #nav-container { 
            position: fixed; right: 40px; top: 50%; transform: translateY(-50%); 
            z-index: 200; display: flex; flex-direction: column; gap: 20px; 
            text-align: right; pointer-events: none; opacity: 0; transition: opacity 0.5s;
        }
        .side-link { 
            pointer-events: auto; text-decoration: none; color: var(--white); 
            font-weight: 900; font-size: 24px; letter-spacing: 2px; 
            transition: opacity 0.2s, transform 0.2s; display: block; 
        }
        .side-link:hover { opacity: 0.5; transform: translateX(-10px); }

        .status { position: fixed; bottom: 20px; left: 20px; font-family: monospace; font-size: 9px; color: var(--white); opacity: 0; pointer-events: none; text-transform: uppercase; letter-spacing: 1px; transition: opacity 0.5s;}
        
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--black);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; color: var(--white); transition: opacity 0.8s ease-out;
        }
        .loading-text { font-size: 16px; font-weight: 900; letter-spacing: 4px; margin-bottom: 20px; animation: blink 1s infinite; }
        .bar-bg { width: 200px; height: 2px; background: rgba(255,255,255,0.2); }
        #bar-fill { width: 0%; height: 100%; background: var(--white); transition: width 0.1s; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loading-text">LOADING...</div>
        <div class="bar-bg"><div id="bar-fill"></div></div>
    </div>

    <div id="ui-header">
        <a href="index.html" class="logo">わやたに</a>
    </div>

    <nav id="nav-container">
        <a href="#" class="side-link">PROFILE</a>
        <a href="#" class="side-link">WORKS</a>
        <a href="#" class="side-link">SHOP</a>
        <a href="#" class="side-link">CONTACT</a>
    </nav>

    <div class="status">MODE: COSMOS_DRIFT // ENTITY: ACTIVE // LIGHT: SPOTLIGHT_REINFORCED</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, clock;
        let objects = [];
        let particles;
        let cameraLight; // カメラ追従スポットライト
        
        let isDragging = false;
        let lon = 0, lat = 0;
        let targetLon = 0, targetLat = 0; 
        let phi = 0, theta = 0;
        let pointerX = 0, pointerY = 0;

        const loadingScreen = document.getElementById('loading-screen');
        const barFill = document.getElementById('bar-fill');
        const uiHeader = document.getElementById('ui-header');
        const navContainer = document.getElementById('nav-container');
        const statusElem = document.querySelector('.status');
        let isReady = false;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.0006); // フォグも維持

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.set(0, 0, 500);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // --- ライトの修正 ---
            // 環境光は弱めに（宇宙の暗さを出す）
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            
            // ★強力なスポットライトをカメラに追加
            cameraLight = new THREE.SpotLight(0xffffff, 50000); // 以前のポイントライトより桁違いに強く
            cameraLight.position.set(0, 0, 50); // カメラの少し前方から照らす
            cameraLight.angle = Math.PI / 6; // 照射角
            cameraLight.penumbra = 0.5; // ボケ足
            cameraLight.decay = 2; // 減衰
            cameraLight.distance = 2500; // 届く距離
            
            camera.add(cameraLight); // ライトをカメラに追加（これで追従する）
            
            // スポットライトのターゲット（カメラの100ユニット先を常に照らす）
            const lightTarget = new THREE.Object3D();
            lightTarget.position.set(0, 0, -100);
            camera.add(lightTarget);
            cameraLight.target = lightTarget;
            
            scene.add(camera);

            const partGeom = new THREE.BufferGeometry();
            const partPos = [];
            for (let i = 0; i < 9000; i++) {
                partPos.push(THREE.MathUtils.randFloatSpread(5000));
                partPos.push(THREE.MathUtils.randFloatSpread(5000));
                partPos.push(THREE.MathUtils.randFloatSpread(5000));
            }
            partGeom.setAttribute('position', new THREE.Float32BufferAttribute(partPos, 3));
            particles = new THREE.Points(partGeom, new THREE.PointsMaterial({ color: 0xffffff, size: 2, transparent: true, opacity: 0.6 }));
            particles.visible = false; 
            scene.add(particles);

            const manager = new THREE.LoadingManager();
            manager.onProgress = (url, loaded, total) => barFill.style.width = (loaded/total*100)+'%';
            manager.onLoad = () => {
                if(particles) particles.visible = true;
                objects.forEach(obj => obj.visible = true);
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    uiHeader.style.opacity = '1';
                    navContainer.style.opacity = '1';
                    statusElem.style.opacity = '0.5';
                }, 800);
                isReady = true;
            };

            const loader = new GLTFLoader(manager);
            loader.load('./char.glb', (gltf) => {
                const masterModel = gltf.scene;
                
                // --- ★モデルのマテリアルを強制発光させる ---
                masterModel.traverse((child) => {
                    if (child.isMesh) {
                        // 元の色に関わらず、少し灰色に自ら発光させる
                        child.material.emissive = new THREE.Color(0x333333); // 灰色。明るすぎないように。
                        child.material.emissiveIntensity = 1.0;
                    }
                });

                for (let i = 0; i < 40; i++) {
                    const instance = masterModel.clone();
                    instance.position.set(
                        THREE.MathUtils.randFloatSpread(3500),
                        THREE.MathUtils.randFloatSpread(3500),
                        THREE.MathUtils.randFloatSpread(3500)
                    );
                    instance.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
                    // 巨大設定（25〜40倍）
                    const s = 25 + Math.random() * 15;
                    instance.scale.set(s, s, s);
                    instance.visible = false; 
                    scene.add(instance);
                    objects.push(instance);
                }
            });

            document.addEventListener('pointerdown', (e) => {
                if(e.target.closest('#nav-container') || e.target.closest('#ui-header')) return; 
                isDragging = true; pointerX = e.clientX; pointerY = e.clientY;
            });
            document.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                targetLon -= (e.clientX - pointerX) * 0.4; // 高感度設定
                targetLat -= (e.clientY - pointerY) * 0.3;
                pointerX = e.clientX; pointerY = e.clientY;
            });
            document.addEventListener('pointerup', () => isDragging = false);
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isReady) { targetLon += 0.05; }
            else {
                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                camera.position.add(direction.multiplyScalar(1.8));
            }
            lon += (targetLon - lon) * 0.15; // 慣性
            lat += (targetLat - lat) * 0.15;
            lat = Math.max(-85, Math.min(85, lat)); 
            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);
            const target = new THREE.Vector3();
            target.setFromSphericalCoords(1, phi, theta).add(camera.position);
            camera.lookAt(target);

            objects.forEach(obj => {
                if(!isReady) return;
                obj.rotation.y += 0.005;
                if (obj.position.distanceTo(camera.position) > 2800) {
                    const forward = new THREE.Vector3();
                    camera.getWorldDirection(forward);
                    obj.position.copy(camera.position).add(forward.multiplyScalar(2200));
                    obj.position.x += THREE.MathUtils.randFloatSpread(3000);
                    obj.position.y += THREE.MathUtils.randFloatSpread(3000);
                }
            });
            if (particles && isReady) particles.rotation.y += 0.0001;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
