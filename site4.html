<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>わやたに | Dark Wobbly Maze</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --ui-font: 'Helvetica Neue', Arial, sans-serif;
            --white: #ffffff;
            --black: #000000;
        }
        body { margin: 0; background: var(--black); overflow: hidden; font-family: var(--ui-font); cursor: grab; }
        body:active { cursor: grabbing; }
        
        /* UIを白抜きにして視認性を確保 */
        #ui-header { position: fixed; top: 40px; left: 40px; z-index: 100; pointer-events: none; }
        .logo { font-size: 24px; font-weight: 900; border: 2px solid var(--white); padding: 5px 15px; color: var(--white); background: transparent; display: inline-block; pointer-events: auto; letter-spacing: -1px; }
        
        #nav-container { position: fixed; right: 40px; top: 50%; transform: translateY(-50%); z-index: 200; display: flex; flex-direction: column; gap: 20px; text-align: right; pointer-events: none; }
        .side-link { pointer-events: auto; text-decoration: none; color: var(--white); font-weight: 900; font-size: 24px; letter-spacing: 2px; transition: opacity 0.2s, transform 0.2s; display: block; }
        .side-link:hover { opacity: 0.5; transform: translateX(-10px); }
        
        .status { position: fixed; bottom: 20px; left: 20px; font-family: monospace; font-size: 9px; color: var(--white); opacity: 0.5; pointer-events: none; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="ui-header">
        <h1 class="logo">わやたに</h1>
    </div>

    <nav id="nav-container">
        <a href="#" class="side-link">PROFILE</a>
        <a href="#" class="side-link">WORKS</a>
        <a href="#" class="side-link">SHOP</a>
        <a href="#" class="side-link">CONTACT</a>
    </nav>

    <div class="status">MODE: NOIR_DRIFT // FOG: ENABLED // ENTITY: GLB_LOADED</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, clock;
        let segments = [];
        let isDragging = false;
        let targetRotX = 0, targetRotY = 0;
        let previousMouseX = 0, previousMouseY = 0;

        const UNIT = 40;
        let currentPos = new THREE.Vector3(0, 0, 0);
        let currentDir = new THREE.Vector3(0, 0, -1);
        let pathPoints = [];

        let model = null; // GLBモデル用
        const loader = new GLTFLoader();

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // 真っ黒
            
            // --- フォグ（霧）の設定 ---
            // 第2引数の数値(0.015)を大きくすると霧が濃くなり、近くまで見えなくなります
            scene.fog = new THREE.FogExp2(0x000000, 0.012);

            camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // 暗闇でもモデルが見えるようにライトを追加
            scene.add(new THREE.AmbientLight(0xffffff, 1.0));
            const pointLight = new THREE.PointLight(0xffffff, 1000);
            camera.add(pointLight); // カメラに追従するライト
            scene.add(camera);

            // --- GLBデータの読み込み ---
            // 'your-model.glb' を自分のファイル名に書き換えてください
            loader.load('char.glb', (gltf) => {
                model = gltf.scene;
                model.scale.set(8, 8, 8); 
                scene.add(model);
            }, undefined, (error) => {
                console.warn("GLBが見つかりません。デフォルトのモデルを待機します。");
            });

            // 道の初期生成
            for (let i = 0; i < 60; i++) spawnSegment();

            window.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'A') return;
                isDragging = true; previousMouseX = e.clientX; previousMouseY = e.clientY;
            });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                targetRotY -= (e.clientX - previousMouseX) * 0.005;
                targetRotX -= (e.clientY - previousMouseY) * 0.005;
                targetRotX = Math.max(-0.6, Math.min(0.6, targetRotX));
                previousMouseX = e.clientX; previousMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function spawnSegment() {
            const group = new THREE.Group();
            // 発光しているように見える白い線
            const material = new THREE.LineBasicMaterial({ color: 0xffffff });
            
            const s = UNIT / 2;
            const pts = [
                [-s, -s, 0], [s, -s, 0], [s, s, 0], [-s, s, 0], [-s, -s, 0],
                [-s, -s, -UNIT], [s, -s, -UNIT], [s, s, -UNIT], [-s, s, -UNIT], [-s, -s, -UNIT],
                null, [s, -s, 0], [s, -s, -UNIT], null, [s, s, 0], [s, s, -UNIT], null, [-s, s, 0], [-s, s, -UNIT]
            ];
            
            let temp = [];
            pts.forEach(p => {
                if (p === null) { draw(temp, group, material); temp = []; }
                else temp.push(new THREE.Vector3(...p));
            });
            draw(temp, group, material);

            group.position.copy(currentPos);
            group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), currentDir);
            
            group.userData.basePos = group.position.clone();
            group.userData.baseRot = group.rotation.clone();

            scene.add(group);
            segments.push(group);
            pathPoints.push(currentPos.clone());

            currentPos.add(currentDir.clone().multiplyScalar(UNIT));
            
            // 直進性を高くして「道」を形成
            if (Math.random() < 0.15) {
                const turn = Math.random() > 0.5 ? Math.PI / 2 : -Math.PI / 2;
                currentDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), turn).round();
            }
        }

        function draw(pts, group, mat) {
            if (pts.length < 2) return;
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            group.add(new THREE.Line(geom, mat));
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // カメラの前進
            if (pathPoints.length > 10) {
                const targetPoint = pathPoints[1];
                const direction = new THREE.Vector3().subVectors(targetPoint, camera.position);
                
                if (direction.length() > 2) {
                    direction.normalize().multiplyScalar(1.0); // 少しゆったり進む
                    camera.position.add(direction);
                    const lookAtTarget = pathPoints[5] || targetPoint;
                    camera.lookAt(lookAtTarget);
                } else {
                    pathPoints.shift();
                    spawnSegment();
                }
            }

            // --- GLBモデルの浮遊アニメーション ---
            if (model) {
                const t = time * 0.5;
                // カメラの少し先をふわふわ漂う
                const driftX = Math.sin(t) * 40;
                const driftY = Math.cos(t * 1.2) * 20;
                const forwardOffset = -100; // カメラの100ユニット前方
                
                // カメラの向きに合わせて位置を計算
                const targetPos = new THREE.Vector3(driftX, driftY, forwardOffset);
                targetPos.applyQuaternion(camera.quaternion);
                targetPos.add(camera.position);

                model.position.lerp(targetPos, 0.05);
                model.rotation.y += 0.01;
                model.rotation.z = Math.sin(t) * 0.2;
            }

            // --- 道のぐらぐらアニメーション ---
            segments.forEach((seg, i) => {
                // 時間とインデックスでうねりを作る
                const waveX = Math.sin(time * 1.5 + i * 0.3) * 10;
                const waveY = Math.cos(time * 1.2 + i * 0.2) * 10;
                const roll = Math.sin(time * 1.5 + i * 0.4) * 0.2;

                seg.position.x = seg.userData.basePos.x + waveX;
                seg.position.y = seg.userData.basePos.y + waveY;
                seg.rotation.z = roll;

                // 遠すぎたら削除
                if (camera.position.distanceTo(seg.position) > 1200) {
                    scene.remove(seg);
                    segments.splice(i, 1);
                }
            });

            // 視点の微調整
            camera.rotation.x += targetRotX;
            camera.rotation.y += targetRotY;
            if (!isDragging) { targetRotX *= 0.9; targetRotY *= 0.9; }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
