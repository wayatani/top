<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>わやたに | COSMOS DRIFT 360 RECOVER</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root { --white: #ffffff; --black: #000000; --ui-font: 'Helvetica Neue', Arial, sans-serif; }
        body { margin: 0; background: var(--black); overflow: hidden; font-family: var(--ui-font); cursor: grab; }
        body:active { cursor: grabbing; }
        #ui-header { position: fixed; top: 40px; left: 40px; z-index: 100; pointer-events: none; }
        .logo { font-size: 24px; font-weight: 900; border: 2px solid var(--white); padding: 5px 15px; color: var(--white); background: transparent; display: inline-block; pointer-events: auto; text-decoration: none; letter-spacing: -1px; }
        .status { position: fixed; bottom: 20px; left: 20px; font-family: monospace; font-size: 9px; color: var(--white); opacity: 0.5; pointer-events: none; text-transform: uppercase; letter-spacing: 1px;}
    </style>
</head>
<body>

    <div id="ui-header">
        <a href="index.html" class="logo">わやたに</a>
    </div>

    <div class="status">ENTITY_CHECK: IN_PROGRESS // STATUS: SEARCHING_GLB</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, clock;
        let objects = [];
        let particles;
        
        let isDragging = false;
        let lon = 0, lat = 0;
        let targetLon = 0, targetLat = 0; 
        let phi = 0, theta = 0;
        let pointerX = 0, pointerY = 0;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.0005); // 少しフォグを薄くして遠くを見えやすく

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.set(0, 0, 500);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // ライトを少し強めに
            scene.add(new THREE.AmbientLight(0xffffff, 1.2));
            const pointLight = new THREE.PointLight(0xffffff, 2000, 2000);
            camera.add(pointLight); 
            scene.add(camera);

            // 星屑
            const partGeom = new THREE.BufferGeometry();
            const partPos = [];
            for (let i = 0; i < 8000; i++) {
                partPos.push(THREE.MathUtils.randFloatSpread(5000));
                partPos.push(THREE.MathUtils.randFloatSpread(5000));
                partPos.push(THREE.MathUtils.randFloatSpread(5000));
            }
            partGeom.setAttribute('position', new THREE.Float32BufferAttribute(partPos, 3));
            particles = new THREE.Points(partGeom, new THREE.PointsMaterial({ color: 0xffffff, size: 2, transparent: true, opacity: 0.5 }));
            scene.add(particles);

            // --- GLB読み込み（デバッグ強化版） ---
            const loader = new GLTFLoader();
            // GitHub上でのパスミスを防ぐため './char.glb' に変更
            loader.load('./char.glb', (gltf) => {
                const masterModel = gltf.scene;
                console.log("GLBの読み込みに成功しました:", masterModel);
                document.querySelector('.status').innerText = "ENTITY_STATUS: ACTIVE // GLB_LOADED";

                for (let i = 0; i < 50; i++) {
                    const instance = masterModel.clone();
                    // 出現範囲をカメラの周囲に適切に散らす
                    instance.position.set(
                        THREE.MathUtils.randFloatSpread(4000),
                        THREE.MathUtils.randFloatSpread(4000),
                        THREE.MathUtils.randFloatSpread(4000)
                    );
                    instance.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
                    
                    // サイズを前回より少し控えめに（15〜25倍）
                    const s = 15 + Math.random() * 10;
                    instance.scale.set(s, s, s);
                    
                    scene.add(instance);
                    objects.push(instance);
                }
            }, (xhr) => {
                // 読み込み進捗を表示
                console.log( ( xhr.loaded / xhr.total * 100 ) + '% loaded' );
            }, (err) => {
                console.error("GLBの読み込みに失敗しました。ファイル名やパスを確認してください。", err);
                document.querySelector('.status').innerText = "ENTITY_ERROR: FILE_NOT_FOUND";
            });

            document.addEventListener('pointerdown', (e) => {
                isDragging = true;
                pointerX = e.clientX;
                pointerY = e.clientY;
            });

            document.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - pointerX;
                const deltaY = e.clientY - pointerY;
                targetLon -= deltaX * 0.4; 
                targetLat -= deltaY * 0.3;
                pointerX = e.clientX;
                pointerY = e.clientY;
            });

            document.addEventListener('pointerup', () => isDragging = false);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            lon += (targetLon - lon) * 0.15; 
            lat += (targetLat - lat) * 0.15;
            lat = Math.max(-85, Math.min(85, lat)); 

            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            const target = new THREE.Vector3();
            target.setFromSphericalCoords(1, phi, theta).add(camera.position);
            camera.lookAt(target);

            // 前進
            const moveSpeed = 2.0;
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            camera.position.add(direction.multiplyScalar(moveSpeed));

            // オブジェクトのループ
            objects.forEach(obj => {
                obj.rotation.y += 0.005;
                // カメラから離れすぎたら前方に転生
                if (obj.position.distanceTo(camera.position) > 2800) {
                    const forward = new THREE.Vector3();
                    camera.getWorldDirection(forward);
                    // カメラの向きの2000ユニット先に配置
                    obj.position.copy(camera.position).add(forward.multiplyScalar(2000));
                    obj.position.x += THREE.MathUtils.randFloatSpread(3000);
                    obj.position.y += THREE.MathUtils.randFloatSpread(3000);
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
