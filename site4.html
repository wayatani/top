<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>わやたに | COSMOS DRIFT 360 FINAL</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root { --white: #ffffff; --black: #000000; --ui-font: 'Helvetica Neue', Arial, sans-serif; }
        body { margin: 0; background: var(--black); overflow: hidden; font-family: var(--ui-font); cursor: grab; }
        body:active { cursor: grabbing; }
        
        #ui-header { position: fixed; top: 40px; left: 40px; z-index: 100; pointer-events: none; }
        .logo { font-size: 24px; font-weight: 900; border: 2px solid var(--white); padding: 5px 15px; color: var(--white); background: transparent; display: inline-block; pointer-events: auto; text-decoration: none; letter-spacing: -1px; }
        
        .status { position: fixed; bottom: 20px; left: 20px; font-family: monospace; font-size: 9px; color: var(--white); opacity: 0.5; pointer-events: none; text-transform: uppercase; letter-spacing: 1px;}
    </style>
</head>
<body>

    <div id="ui-header">
        <a href="index.html" class="logo">わやたに</a>
    </div>

    <div class="status">CONTROL: SEAMLESS_DRAG // MODE: 360_EXPLORATION // ENTITY: GLB_INFINITY</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, clock;
        let objects = [];
        let particles;
        
        // 視点操作用の変数（Lerpによる滑らかな追従）
        let isDragging = false;
        let lon = 0, lat = 0;
        let targetLon = 0, targetLat = 0; 
        let phi = 0, theta = 0;
        let pointerX = 0, pointerY = 0;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            // 宇宙の奥行きを出すフォグ
            scene.fog = new THREE.FogExp2(0x000000, 0.0008);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 4000);
            // 初期位置
            camera.position.set(0, 0, 500);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // ライト
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const pointLight = new THREE.PointLight(0xffffff, 1200);
            camera.add(pointLight); 
            scene.add(camera);

            // 星屑（パーティクル）
            const partGeom = new THREE.BufferGeometry();
            const partPos = [];
            for (let i = 0; i < 10000; i++) {
                partPos.push(THREE.MathUtils.randFloatSpread(4000));
                partPos.push(THREE.MathUtils.randFloatSpread(4000));
                partPos.push(THREE.MathUtils.randFloatSpread(4000));
            }
            partGeom.setAttribute('position', new THREE.Float32BufferAttribute(partPos, 3));
            particles = new THREE.Points(partGeom, new THREE.PointsMaterial({ color: 0xffffff, size: 2, transparent: true, opacity: 0.6 }));
            scene.add(particles);

            // GLBモデル配置
            const loader = new GLTFLoader();
            loader.load('char.glb', (gltf) => {
                const masterModel = gltf.scene;
                for (let i = 0; i < 70; i++) {
                    const instance = masterModel.clone();
                    instance.position.set(
                        THREE.MathUtils.randFloatSpread(3000),
                        THREE.MathUtils.randFloatSpread(3000),
                        THREE.MathUtils.randFloatSpread(3000)
                    );
                    instance.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
                    const s = 6 + Math.random() * 12;
                    instance.scale.set(s, s, s);
                    scene.add(instance);
                    objects.push(instance);
                }
            }, undefined, (err) => console.log("GLB load error or not found."));

            // --- イベントリスナー（シームレスなドラッグ用） ---
            document.addEventListener('pointerdown', (e) => {
                isDragging = true;
                pointerX = e.clientX;
                pointerY = e.clientY;
            });

            document.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                // 現在位置と前回位置の差分を計算
                const deltaX = e.clientX - pointerX;
                const deltaY = e.clientY - pointerY;

                // 差分を目標角度に加算
                targetLon -= deltaX * 0.15; // 横回転の感度
                targetLat -= deltaY * 0.15; // 縦回転の感度

                pointerX = e.clientX;
                pointerY = e.clientY;
            });

            document.addEventListener('pointerup', () => {
                isDragging = false;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // --- 視点のなめらかな計算 (Lerp) ---
            lon += (targetLon - lon) * 0.1; 
            lat += (targetLat - lat) * 0.1;
            lat = Math.max(-85, Math.min(85, lat)); // 反転防止

            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            const target = new THREE.Vector3();
            target.setFromSphericalCoords(1, phi, theta).add(camera.position);
            camera.lookAt(target);

            // --- 進行方向へ進む ---
            const moveSpeed = 2.0;
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            camera.position.add(direction.multiplyScalar(moveSpeed));

            // --- オブジェクトのループ（転生）ロジック ---
            objects.forEach(obj => {
                obj.rotation.y += 0.005;
                obj.rotation.z += 0.002;

                // カメラから離れすぎた（通り過ぎた）場合に前方へ再配置
                if (obj.position.distanceTo(camera.position) > 2500) {
                    const forward = new THREE.Vector3();
                    camera.getWorldDirection(forward);
                    // カメラの向きの1800ユニット先をベースにする
                    obj.position.copy(camera.position).add(forward.multiplyScalar(1800));
                    
                    // 前方の視界を塞がない程度に左右上下に散らす
                    obj.position.x += THREE.MathUtils.randFloatSpread(2500);
                    obj.position.y += THREE.MathUtils.randFloatSpread(2500);
                    obj.position.z += THREE.MathUtils.randFloatSpread(500);
                }
            });

            // 星屑のわずかな自転
            if (particles) {
                particles.rotation.y += 0.0002;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
