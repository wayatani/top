<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>わやたに | PIXEL VOID DRIFT</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root { --white: #ffffff; --black: #000000; --ui-font: 'Helvetica Neue', Arial, sans-serif; }
        body { margin: 0; background: var(--black); overflow: hidden; font-family: var(--ui-font); cursor: grab; }
        
        /* ドット感を出すためにCanvasにアンチエイリアスをかけない */
        canvas { 
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        #ui-header { position: fixed; top: 40px; left: 40px; z-index: 1000; }
        .logo { font-size: 24px; font-weight: 900; border: 2px solid var(--white); padding: 5px 15px; color: var(--white); text-decoration: none; letter-spacing: -1px; }
        
        /* 復活したナビゲーションタブ */
        #nav-container { 
            position: fixed; right: 40px; top: 50%; transform: translateY(-50%); 
            z-index: 1000; display: flex; flex-direction: column; gap: 25px; text-align: right; 
        }
        .side-link { 
            color: var(--white); text-decoration: none; font-weight: 900; font-size: 24px; 
            letter-spacing: 2px; transition: 0.3s; text-shadow: 2px 2px 4px rgba(0,0,0,1);
        }
        .side-link:hover { opacity: 0.5; transform: translateX(-10px); }

        #score-board { position: fixed; top: 40px; right: 40px; color: var(--white); font-size: 32px; font-weight: 900; z-index: 1000; letter-spacing: 2px; text-shadow: 2px 2px 0px #000; }

        #game-over {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 2000; color: var(--white);
        }
        .retry-btn { margin-top: 20px; padding: 10px 30px; border: 2px solid var(--white); background: none; color: var(--white); cursor: pointer; font-weight: 900; }
    </style>
</head>
<body>

    <div id="ui-header"><a href="index.html" class="logo">わやたに</a></div>
    <div id="score-board">00000</div>

    <div id="game-over">
        <h1 style="font-size: 60px; letter-spacing: 10px;">GAME OVER</h1>
        <button class="retry-btn" onclick="location.reload()">RETRY</button>
    </div>

    <nav id="nav-container">
        <a href="index.html?page=profile" class="side-link">PROFILE</a>
        <a href="index.html?page=works" class="side-link">WORKS</a>
        <a href="index.html?page=shop" class="side-link">SHOP</a>
        <a href="index.html?page=contact" class="side-link">CONTACT</a>
    </nav>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, clock;
        let items = [], bombs = [], particles;
        let score = 0, isGameOver = false;
        let lon = 0, lat = 0, targetLon = 0, targetLat = 0, pointerX = 0, pointerY = 0, isDragging = false;

        // ★ドット絵解像度の倍率（0.25だとかなり荒く、0.5だと適度なドット感）
        const PIXEL_RATIO = 0.4; 

        init();

        function init() {
            scene = new THREE.Scene();
            // 視認性を上げるために背景を完全な黒から「深い紺色」へ
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.0008);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 5000);
            
            renderer = new THREE.WebGLRenderer({ antialias: false }); // ドット絵なのでアンチエイリアスOFF
            renderer.setSize(window.innerWidth, window.innerHeight);
            // 解像度をわざと下げる
            renderer.setPixelRatio(window.devicePixelRatio * PIXEL_RATIO);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // ライト：視認性のためにAmbientを強く、Spotlightを追加
            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            const sun = new THREE.DirectionalLight(0xffffff, 2);
            sun.position.set(1, 1, 1);
            scene.add(sun);

            // 星屑
            const starGeom = new THREE.BufferGeometry();
            const starPos = [];
            for(let i=0; i<3000; i++) {
                starPos.push(THREE.MathUtils.randFloatSpread(4000), THREE.MathUtils.randFloatSpread(4000), THREE.MathUtils.randFloatSpread(4000));
            }
            starGeom.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            particles = new THREE.Points(starGeom, new THREE.PointsMaterial({color: 0xffffff, size: 4}));
            scene.add(particles);

            // GLB読み込み
            const loader = new GLTFLoader();
            loader.load('./char.glb', (gltf) => {
                for(let i=0; i<30; i++) spawnItem(gltf.scene.clone());
            });

            // 爆弾生成
            for(let i=0; i<25; i++) spawnBomb();

            document.addEventListener('pointerdown', e => { if(e.target.closest('#nav-container') || e.target.closest('#ui-header')) return; isDragging = true; pointerX = e.clientX; pointerY = e.clientY; });
            document.addEventListener('pointermove', e => { if(!isDragging) return; targetLon -= (e.clientX - pointerX)*0.5; targetLat -= (e.clientY - pointerY)*0.4; pointerX = e.clientX; pointerY = e.clientY; });
            document.addEventListener('pointerup', () => isDragging = false);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function spawnItem(model) {
            model.position.set(THREE.MathUtils.randFloatSpread(3000), THREE.MathUtils.randFloatSpread(3000), THREE.MathUtils.randFloatSpread(3000));
            model.scale.set(35, 35, 35); // 少し大きく
            scene.add(model);
            items.push(model);
        }

        function spawnBomb() {
            const geom = new THREE.IcosahedronGeometry(20, 0); // カクカクした形にする
            const mat = new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0x330000, flatShading: true });
            const bomb = new THREE.Mesh(geom, mat);
            bomb.position.set(THREE.MathUtils.randFloatSpread(3000), THREE.MathUtils.randFloatSpread(3000), THREE.MathUtils.randFloatSpread(3000));
            scene.add(bomb);
            bombs.push(bomb);
        }

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            camera.position.add(dir.multiplyScalar(2.8));

            lon += (targetLon - lon) * 0.1;
            lat += (targetLat - lat) * 0.1;
            lat = Math.max(-85, Math.min(85, lat));
            const target = new THREE.Vector3();
            target.setFromSphericalCoords(1, THREE.MathUtils.degToRad(90-lat), THREE.MathUtils.degToRad(lon)).add(camera.position);
            camera.lookAt(target);

            // 当たり判定：GLBアイテム
            items.forEach((item) => {
                item.rotation.y += 0.04;
                if (camera.position.distanceTo(item.position) < 60) {
                    score += 100;
                    document.getElementById('score-board').innerText = score.toString().padStart(5, '0');
                    respawn(item, 2500);
                } else if (camera.position.distanceTo(item.position) > 3000) {
                    respawn(item, 2000);
                }
            });

            // 当たり判定：爆弾（赤く光るトゲトゲ）
            bombs.forEach(bomb => {
                bomb.rotation.x += 0.05;
                if (camera.position.distanceTo(bomb.position) < 40) gameOver();
                if (camera.position.distanceTo(bomb.position) > 3000) respawn(bomb, 2500);
            });

            renderer.render(scene, camera);
        }

        function respawn(obj, distance) {
            const fwd = new THREE.Vector3();
            camera.getWorldDirection(fwd);
            obj.position.copy(camera.position).add(fwd.multiplyScalar(distance));
            obj.position.x += THREE.MathUtils.randFloatSpread(2000);
            obj.position.y += THREE.MathUtils.randFloatSpread(2000);
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'flex';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
