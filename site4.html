<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>わやたに | COSMOS DRIFT FINAL FULL</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root { --white: #ffffff; --black: #000000; --ui-font: 'Helvetica Neue', Arial, sans-serif; }
        body { margin: 0; background: var(--black); overflow: hidden; font-family: var(--ui-font); cursor: grab; }
        body:active { cursor: grabbing; }

        /* 左上ロゴ */
        #ui-header { position: fixed; top: 40px; left: 40px; z-index: 1000; }
        .logo { font-size: 24px; font-weight: 900; border: 2px solid var(--white); padding: 5px 15px; color: var(--white); background: transparent; display: inline-block; text-decoration: none; letter-spacing: -1px; }
        
        /* 右側メニュー（タブ）: 別タブ設定 */
        #nav-container { 
            position: fixed; right: 40px; top: 50%; transform: translateY(-50%); 
            z-index: 9999; display: flex; flex-direction: column; gap: 25px; text-align: right; 
        }
        .side-link { 
            color: var(--white); text-decoration: none; font-weight: 900; font-size: 24px; 
            letter-spacing: 2px; display: block; transition: 0.3s;
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
        }
        .side-link:hover { opacity: 0.5; transform: translateX(-10px); }

        .status { position: fixed; bottom: 20px; left: 20px; font-family: monospace; font-size: 9px; color: var(--white); opacity: 0.5; z-index: 1000;}
        
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--black); display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 10000; 
            color: var(--white); transition: 0.8s;
        }
        .loading-text { font-size: 16px; font-weight: 900; letter-spacing: 4px; animation: blink 1s infinite; }
        .bar-bg { width: 200px; height: 2px; background: rgba(255,255,255,0.2); margin-top: 10px; }
        #bar-fill { width: 0%; height: 100%; background: var(--white); transition: width 0.1s; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loading-text">LOADING...</div>
        <div class="bar-bg"><div id="bar-fill"></div></div>
    </div>

    <div id="ui-header">
        <a href="index.html" class="logo">わやたに</a>
    </div>

    <nav id="nav-container">
        <a href="profile.html" class="side-link" target="_blank">PROFILE</a>
        <a href="works.html" class="side-link" target="_blank">WORKS</a>
        <a href="shop.html" class="side-link" target="_blank">SHOP</a>
        <a href="contact.html" class="side-link" target="_blank">CONTACT</a>
    </nav>

    <div class="status">MODE: SYNC_DRIFT // NAV: EXTERNAL_TAB // ENTITY: ACTIVE</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, clock;
        let objects = [];
        let particles;
        let isDragging = false;
        let lon = 0, lat = 0, targetLon = 0, targetLat = 0, pointerX = 0, pointerY = 0;
        let isReady = false;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.0006);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.set(0, 0, 500);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            clock = new THREE.Clock();

            // ライト設定
            scene.add(new THREE.AmbientLight(0xffffff, 1.2));
            const pointLight = new THREE.PointLight(0xffffff, 2000, 2000);
            camera.add(pointLight); 
            scene.add(camera);

            // 星屑
            const partGeom = new THREE.BufferGeometry();
            const partPos = [];
            for (let i = 0; i < 9000; i++) {
                partPos.push(THREE.MathUtils.randFloatSpread(5000));
                partPos.push(THREE.MathUtils.randFloatSpread(5000));
                partPos.push(THREE.MathUtils.randFloatSpread(5000));
            }
            partGeom.setAttribute('position', new THREE.Float32BufferAttribute(partPos, 3));
            particles = new THREE.Points(partGeom, new THREE.PointsMaterial({ color: 0xffffff, size: 2, transparent: true, opacity: 0.6 }));
            particles.visible = false;
            scene.add(particles);

            const manager = new THREE.LoadingManager();
            manager.onProgress = (url, loaded, total) => {
                document.getElementById('bar-fill').style.width = (loaded/total*100)+'%';
            };
            manager.onLoad = () => {
                if(particles) particles.visible = true;
                objects.forEach(obj => obj.visible = true);
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; }, 800);
                isReady = true;
            };

            const loader = new GLTFLoader(manager);
            loader.load('./char.glb', (gltf) => {
                const masterModel = gltf.scene;
                masterModel.traverse((child) => {
                    if (child.isMesh) {
                        child.material.emissive = new THREE.Color(0x333333);
                        child.material.emissiveIntensity = 0.5;
                    }
                });
                for (let i = 0; i < 45; i++) {
                    const instance = masterModel.clone();
                    instance.position.set(THREE.MathUtils.randFloatSpread(4000), THREE.MathUtils.randFloatSpread(4000), THREE.MathUtils.randFloatSpread(4000));
                    instance.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
                    const s = 25 + Math.random() * 15;
                    instance.scale.set(s, s, s);
                    instance.visible = false;
                    scene.add(instance);
                    objects.push(instance);
                }
            });

            // インタラクション
            document.addEventListener('pointerdown', (e) => {
                if(e.target.closest('#nav-container') || e.target.closest('#ui-header')) return; 
                isDragging = true; pointerX = e.clientX; pointerY = e.clientY;
            });
            document.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                targetLon -= (e.clientX - pointerX) * 0.4; // 360度見回し感度
                targetLat -= (e.clientY - pointerY) * 0.3;
                pointerX = e.clientX; pointerY = e.clientY;
            });
            document.addEventListener('pointerup', () => isDragging = false);
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isReady) {
                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                camera.position.add(direction.multiplyScalar(1.8)); // 前進
            } else {
                targetLon += 0.05;
            }
            
            lon += (targetLon - lon) * 0.15; 
            lat += (targetLat - lat) * 0.15;
            lat = Math.max(-85, Math.min(85, lat)); // 逆さま防止
            
            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            const target = new THREE.Vector3();
            target.setFromSphericalCoords(1, phi, theta).add(camera.position);
            camera.lookAt(target);

            objects.forEach(obj => {
                if(!isReady) return;
                obj.rotation.y += 0.005;
                if (obj.position.distanceTo(camera.position) > 2800) {
                    const forward = new THREE.Vector3();
                    camera.getWorldDirection(forward);
                    obj.position.copy(camera.position).add(forward.multiplyScalar(2200));
                    obj.position.x += THREE.MathUtils.randFloatSpread(3000);
                    obj.position.y += THREE.MathUtils.randFloatSpread(3000);
                }
            });
            if (particles) particles.rotation.y += 0.0001;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
