<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>わやたに | COSMOS DRIFT</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root { --white: #ffffff; --black: #000000; --ui-font: 'Helvetica Neue', Arial, sans-serif; }
        body { margin: 0; background: var(--black); overflow: hidden; font-family: var(--ui-font); cursor: move; }
        #ui-header { position: fixed; top: 40px; left: 40px; z-index: 100; pointer-events: none; }
        .logo { font-size: 24px; font-weight: 900; border: 2px solid var(--white); padding: 5px 15px; color: var(--white); background: transparent; display: inline-block; pointer-events: auto; text-decoration: none; letter-spacing: -1px; }
        .status { position: fixed; bottom: 20px; left: 20px; font-family: monospace; font-size: 9px; color: var(--white); opacity: 0.5; pointer-events: none; text-transform: uppercase; letter-spacing: 1px;}
    </style>
</head>
<body>

    <div id="ui-header">
        <a href="index.html" class="logo">わやたに</a>
    </div>

    <div class="status">MODE: COSMOS_DRIFT // ENTITY: MULTIPLIED // CLOUD: ENABLED</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, clock;
        let objects = []; // 浮遊するGLBたちの配列
        let particles; // 背景の星屑
        
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.0015); // 遠くを闇にする

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
            camera.position.z = 500;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // ライト
            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 1.5);
            sun.position.set(1, 1, 1);
            scene.add(sun);

            // --- 1. 背景の星屑（パーティクル）を追加 ---
            const partGeom = new THREE.BufferGeometry();
            const partPos = [];
            for (let i = 0; i < 5000; i++) {
                partPos.push(THREE.MathUtils.randFloatSpread(2000)); // X
                partPos.push(THREE.MathUtils.randFloatSpread(2000)); // Y
                partPos.push(THREE.MathUtils.randFloatSpread(2000)); // Z
            }
            partGeom.setAttribute('position', new THREE.Float32BufferAttribute(partPos, 3));
            const partMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2, transparent: true, opacity: 0.8 });
            particles = new THREE.Points(partGeom, partMat);
            scene.add(particles);

            // --- 2. GLBモデルを大量に配置 ---
            const loader = new GLTFLoader();
            loader.load('char.glb', (gltf) => {
                const masterModel = gltf.scene;
                
                for (let i = 0; i < 50; i++) {
                    const instance = masterModel.clone();
                    // ランダムな位置に配置
                    instance.position.set(
                        THREE.MathUtils.randFloatSpread(1500),
                        THREE.MathUtils.randFloatSpread(1500),
                        THREE.MathUtils.randFloatSpread(1500)
                    );
                    // ランダムな回転
                    instance.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                    // ランダムな大きさ
                    const s = 5 + Math.random() * 10;
                    instance.scale.set(s, s, s);
                    
                    scene.add(instance);
                    objects.push(instance);
                }
            });

            // マウス移動で視点を少し変える
            window.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX - window.innerWidth / 2) / 100;
                mouseY = (e.clientY - window.innerHeight / 2) / 100;
            });

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // --- カメラの自動前進 ---
            camera.position.z -= 1.5; // 奥へ進み続ける
            
            // マウスに追従するなめらかな視点移動（Lerp）
            targetX += (mouseX - targetX) * 0.05;
            targetY += (mouseY - targetY) * 0.05;
            camera.lookAt(targetX, -targetY, camera.position.z - 100);

            // --- 空間のループ処理 ---
            // カメラが通り過ぎたオブジェクトを、前方に再配置することで無限ループを作る
            objects.forEach(obj => {
                obj.rotation.y += 0.01; // 個別に回転
                obj.rotation.z += 0.005;

                if (obj.position.z > camera.position.z + 200) {
                    obj.position.z -= 1500; // 遥か前方へ移動
                }
            });

            // 星屑もループ
            if (particles) {
                particles.rotation.y += 0.0005;
                if (particles.position.z > camera.position.z + 500) {
                    particles.position.z -= 1000;
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
