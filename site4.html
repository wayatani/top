<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>わやたに | Wobbly Infinite Maze</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --ui-font: 'Helvetica Neue', Arial, sans-serif;
            --black: #000000;
            --white: #ffffff;
        }
        body { margin: 0; background: var(--white); overflow: hidden; font-family: var(--ui-font); cursor: grab; }
        body:active { cursor: grabbing; }
        #ui-header { position: fixed; top: 40px; left: 40px; z-index: 100; pointer-events: none; }
        .logo { font-size: 24px; font-weight: 900; border: 2px solid var(--black); padding: 5px 15px; background: var(--white); display: inline-block; pointer-events: auto; letter-spacing: -1px; }
        #nav-container { position: fixed; right: 40px; top: 50%; transform: translateY(-50%); z-index: 200; display: flex; flex-direction: column; gap: 20px; text-align: right; pointer-events: none; }
        .side-link { pointer-events: auto; text-decoration: none; color: var(--black); font-weight: 900; font-size: 24px; letter-spacing: 2px; transition: opacity 0.2s, transform 0.2s; display: block; }
        .side-link:hover { opacity: 0.5; transform: translateX(-10px); }
        .status { position: fixed; bottom: 20px; left: 20px; font-family: monospace; font-size: 9px; opacity: 0.3; pointer-events: none; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="ui-header">
        <h1 class="logo">わやたに</h1>
    </div>

    <nav id="nav-container">
        <a href="#" class="side-link">PROFILE</a>
        <a href="#" class="side-link">WORKS</a>
        <a href="#" class="side-link">SHOP</a>
        <a href="#" class="side-link">CONTACT</a>
    </nav>

    <div class="status">MAZE_ENGINE: HIGH_WOBBLE_MODE // STATUS: STABILIZING_PATH</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, clock;
        let segments = [];
        let isDragging = false;
        let targetRotX = 0, targetRotY = 0;
        let previousMouseX = 0, previousMouseY = 0;

        const UNIT = 40;
        let currentPos = new THREE.Vector3(0, 0, 0);
        let currentDir = new THREE.Vector3(0, 0, -1);
        let pathPoints = [];

        let character = null;
        const loader = new GLTFLoader();

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            
            // 視野角を少し広げて没入感をアップ
            camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            const sun = new THREE.DirectionalLight(0xffffff, 1.0);
            sun.position.set(50, 80, 50);
            scene.add(sun);

            // キャラクター読み込み
            loader.load('char.glb', (gltf) => {
                character = gltf.scene;
                character.scale.set(6, 6, 6); 
                scene.add(character);
            }, undefined, (err) => console.log("GLB not found, continuing..."));

            // 初期セグメント生成（多めに生成して道を作る）
            for (let i = 0; i < 50; i++) spawnSegment();

            window.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'A') return;
                isDragging = true; previousMouseX = e.clientX; previousMouseY = e.clientY;
            });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                targetRotY -= (e.clientX - previousMouseX) * 0.005;
                targetRotX -= (e.clientY - previousMouseY) * 0.005;
                targetRotX = Math.max(-0.6, Math.min(0.6, targetRotX));
                previousMouseX = e.clientX; previousMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function spawnSegment() {
            const group = new THREE.Group();
            const material = new THREE.LineBasicMaterial({ 
                color: 0x000000,
                linewidth: 2 // 注意: WebGLでは多くのブラウザで1固定ですが、気分的に。
            });
            
            const s = UNIT / 2;
            // 立方体のワイヤーフレーム構造
            const pts = [
                [-s, -s, 0], [s, -s, 0], [s, s, 0], [-s, s, 0], [-s, -s, 0],
                [-s, -s, -UNIT], [s, -s, -UNIT], [s, s, -UNIT], [-s, s, -UNIT], [-s, -s, -UNIT],
                null, [s, -s, 0], [s, -s, -UNIT], null, [s, s, 0], [s, s, -UNIT], null, [-s, s, 0], [-s, s, -UNIT]
            ];
            
            let temp = [];
            pts.forEach(p => {
                if (p === null) { draw(temp, group, material); temp = []; }
                else temp.push(new THREE.Vector3(...p));
            });
            draw(temp, group, material);

            // 配置
            group.position.copy(currentPos);
            group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), currentDir);
            
            // 道としての基準データを保存
            group.userData.basePos = group.position.clone();
            group.userData.baseRot = group.rotation.clone();
            group.userData.offset = Math.random() * 10;
            group.userData.id = segments.length;

            scene.add(group);
            segments.push(group);
            pathPoints.push(currentPos.clone());

            // 次の座標を計算
            currentPos.add(currentDir.clone().multiplyScalar(UNIT));
            
            // 曲がり角の生成（道っぽさを保つため、直進率を高めに設定）
            if (Math.random() < 0.2) {
                const turn = Math.random() > 0.5 ? Math.PI / 2 : -Math.PI / 2;
                currentDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), turn).round();
            }
        }

        function draw(pts, group, mat) {
            if (pts.length < 2) return;
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            group.add(new THREE.Line(geom, mat));
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // カメラの進行（道に沿って移動）
            if (pathPoints.length > 10) {
                const targetPoint = pathPoints[1];
                const direction = new THREE.Vector3().subVectors(targetPoint, camera.position);
                
                if (direction.length() > 2) {
                    direction.normalize().multiplyScalar(1.2); // 移動速度
                    camera.position.add(direction);
                    
                    // 常に少し先を見る
                    const lookAtTarget = pathPoints[4] || targetPoint;
                    camera.lookAt(lookAtTarget);
                } else {
                    pathPoints.shift();
                    spawnSegment();
                }
            }

            // キャラクターの不規則な動き
            if (character) {
                const t = time * 0.8;
                const targetX = camera.position.x + Math.sin(t) * 60;
                const targetZ = camera.position.z + Math.cos(t) * 60;
                const bounce = Math.abs(Math.sin(time * 5)) * 12;
                character.position.lerp(new THREE.Vector3(targetX, camera.position.y + bounce - 5, targetZ), 0.05);
                character.lookAt(camera.position);
            }

            // 【最重要】セグメントの「うねる道」アニメーション
            segments.forEach((seg, i) => {
                const id = seg.userData.id;
                const offset = seg.userData.offset;
                
                // サイン波を組み合わせて「ぐにゃぐにゃ」させる
                // インデックス(i)を足すことで、後ろから前へ波が伝わるような動きにする
                const waveX = Math.sin(time * 2 + i * 0.3) * 8;
                const waveY = Math.cos(time * 1.5 + i * 0.2) * 8;
                const roll = Math.sin(time * 2 + i * 0.4) * 0.3; // 回転の揺れ
                const pitch = Math.cos(time * 2 + i * 0.3) * 0.2;

                // 基準位置からのオフセットとして適用
                seg.position.x = seg.userData.basePos.x + waveX;
                seg.position.y = seg.userData.basePos.y + waveY;
                
                seg.rotation.z = roll;
                seg.rotation.x = seg.userData.baseRot.x + pitch;

                // 古いセグメントの削除
                if (camera.position.distanceTo(seg.position) > 1000) {
                    scene.remove(seg);
                    segments.splice(i, 1);
                }
            });

            // マウス操作の反映
            camera.rotation.x += targetRotX;
            camera.rotation.y += targetRotY;
            if (!isDragging) { targetRotX *= 0.9; targetRotY *= 0.9; }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
