<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>わやたに | PIXEL VOID DRIFT - VISUAL BALANCE</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root { --white: #ffffff; --black: #000000; --ui-font: 'Helvetica Neue', Arial, sans-serif; }
        body { margin: 0; background: var(--black); overflow: hidden; font-family: var(--ui-font); cursor: grab; }
        canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
        #ui-header { position: fixed; top: 40px; left: 40px; z-index: 1000; }
        .logo { font-size: 24px; font-weight: 900; border: 2px solid var(--white); padding: 5px 15px; color: var(--white); text-decoration: none; letter-spacing: -1px; }
        #nav-container { position: fixed; right: 40px; top: 50%; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 25px; text-align: right; }
        .side-link { color: var(--white); text-decoration: none; font-weight: 900; font-size: 24px; letter-spacing: 2px; transition: 0.3s; text-shadow: 2px 2px 4px rgba(0,0,0,1); }
        .side-link:hover { opacity: 0.5; transform: translateX(-10px); }
        #score-board { position: fixed; top: 40px; right: 40px; color: var(--white); font-size: 32px; font-weight: 900; z-index: 1000; letter-spacing: 2px; text-shadow: 2px 2px 0px #000; }
        #game-over { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; color: var(--white); }
        .retry-btn { margin-top: 20px; padding: 10px 30px; border: 2px solid var(--white); background: none; color: var(--white); cursor: pointer; font-weight: 900; }
    </style>
</head>
<body>

    <div id="ui-header"><a href="index.html" class="logo">わやたに</a></div>
    <div id="score-board">00000</div>

    <div id="game-over">
        <h1 style="font-size: 60px; letter-spacing: 10px;">GAME OVER</h1>
        <button class="retry-btn" onclick="location.reload()">RETRY</button>
    </div>

    <nav id="nav-container">
        <a href="index.html?page=profile" class="side-link">PROFILE</a>
        <a href="index.html?page=works" class="side-link">WORKS</a>
        <a href="index.html?page=shop" class="side-link">SHOP</a>
        <a href="index.html?page=contact" class="side-link">CONTACT</a>
    </nav>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer;
        let items = [], bombs = [], boosts = [];
        let score = 0, isGameOver = false;
        let lon = 0, lat = 0, targetLon = 0, targetLat = 0, pointerX = 0, pointerY = 0, isDragging = false;

        const BASE_SPEED = 3.0;
        const BOOST_SPEED = 15.0;
        const BASE_FOV = 75;
        const BOOST_FOV = 110;
        let currentSpeed = BASE_SPEED;
        const PIXEL_RATIO = 0.4; 

        init();

        function init() {
            scene = new THREE.Scene();
            // 背景を完全な黒に戻し、発光する球体を際立たせる
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.0012);

            camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth/window.innerHeight, 0.1, 5000);
            
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio * PIXEL_RATIO);
            document.body.appendChild(renderer.domElement);

            // ライト
            scene.add(new THREE.AmbientLight(0x444444)); // 環境光を少し下げて、自発光を際立たせる
            const sun = new THREE.DirectionalLight(0xffffff, 2.5);
            sun.position.set(1, 1, 1);
            scene.add(sun);

            // 星屑
            const starGeom = new THREE.BufferGeometry();
            const starPos = [];
            for(let i=0; i<2000; i++) {
                starPos.push(THREE.MathUtils.randFloatSpread(4000), THREE.MathUtils.randFloatSpread(4000), THREE.MathUtils.randFloatSpread(4000));
            }
            starGeom.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            const particles = new THREE.Points(starGeom, new THREE.PointsMaterial({color: 0xffffff, size: 4}));
            scene.add(particles);

            // GLB読み込み（通常のアイテム）
            const loader = new GLTFLoader();
            loader.load('./char.glb', (gltf) => {
                for(let i=0; i<30; i++) spawnItem(gltf.scene.clone());
            });

            // ★共通のジオメトリ定義（赤い球も青い球も同じ形、同じサイズ）
            const sphereGeom = new THREE.IcosahedronGeometry(20, 0); // カクカクした質感

            // 爆弾（赤）
            const bombMat = new THREE.MeshStandardMaterial({ 
                color: 0xaa0000, 
                emissive: 0xaa0000, // 深い赤の発光
                emissiveIntensity: 0.8,
                flatShading: true 
            });
            for(let i=0; i<20; i++) {
                const bomb = new THREE.Mesh(sphereGeom, bombMat);
                spawnSpawnable(bomb);
                bombs.push(bomb);
            }

            // 加速（青）
            const boostMat = new THREE.MeshStandardMaterial({ 
                color: 0x00ffff, 
                emissive: 0x00ffff, // 鮮やかな青の発光
                emissiveIntensity: 0.8, // 赤と同じ強さの発光
                flatShading: true,
                transparent: true,
                opacity: 0.9 // わずかに透明感を残してアイテム感を出す
            });
            for(let i=0; i<15; i++) {
                const boost = new THREE.Mesh(sphereGeom, boostMat);
                spawnSpawnable(boost);
                boosts.push(boost);
            }

            document.addEventListener('pointerdown', e => { if(e.target.closest('#nav-container') || e.target.closest('#ui-header')) return; isDragging = true; pointerX = e.clientX; pointerY = e.clientY; });
            document.addEventListener('pointermove', e => { if(!isDragging) return; targetLon -= (e.clientX - pointerX)*0.5; targetLat -= (e.clientY - pointerY)*0.4; pointerX = e.clientX; pointerY = e.clientY; });
            document.addEventListener('pointerup', () => isDragging = false);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function spawnItem(model) {
            model.position.set(THREE.MathUtils.randFloatSpread(2500), THREE.MathUtils.randFloatSpread(2500), THREE.MathUtils.randFloatSpread(2500));
            model.scale.set(35, 35, 35);
            scene.add(model);
            items.push(model);
        }

        // 赤玉、青玉の初期配置用共通関数
        function spawnSpawnable(obj) {
            obj.position.set(THREE.MathUtils.randFloatSpread(3000), THREE.MathUtils.randFloatSpread(3000), THREE.MathUtils.randFloatSpread(3000));
            scene.add(obj);
        }

        function respawn(obj, distance) {
            const fwd = new THREE.Vector3();
            camera.getWorldDirection(fwd);
            const targetPos = new THREE.Vector3().copy(camera.position).add(fwd.multiplyScalar(distance));
            
            obj.position.copy(targetPos);
            obj.position.x += THREE.MathUtils.randFloatSpread(1500);
            obj.position.y += THREE.MathUtils.randFloatSpread(1500);
            obj.position.z += THREE.MathUtils.randFloatSpread(1500);
        }

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            camera.position.add(dir.multiplyScalar(currentSpeed));

            // 速度とFOVを元に戻す
            currentSpeed += (BASE_SPEED - currentSpeed) * 0.02;
            camera.fov += (BASE_FOV - camera.fov) * 0.06;
            camera.updateProjectionMatrix();

            // 回転
            lon += (targetLon - lon) * 0.1;
            lat += (targetLat - lat) * 0.1;
            lat = Math.max(-85, Math.min(85, lat));
            const target = new THREE.Vector3();
            target.setFromSphericalCoords(1, THREE.MathUtils.degToRad(90-lat), THREE.MathUtils.degToRad(lon)).add(camera.position);
            camera.lookAt(target);

            // 当たり判定：GLBアイテム
            items.forEach((item) => {
                item.rotation.y += 0.04;
                if (camera.position.distanceTo(item.position) < 70) {
                    score += 100;
                    updateScore();
                    respawn(item, 3000);
                } else if (camera.position.distanceTo(item.position) > 4000) {
                    respawn(item, 3000);
                }
            });

            // 当たり判定：爆弾（赤玉）
            bombs.forEach(bomb => {
                bomb.rotation.x += 0.05;
                // 当たり判定距離を調整
                if (camera.position.distanceTo(bomb.position) < 45) gameOver();
                if (camera.position.distanceTo(bomb.position) > 4000) respawn(bomb, 3000);
            });

            // 当たり判定：加速アイテム（青玉）
            boosts.forEach(boost => {
                boost.rotation.y += 0.08;
                boost.rotation.z += 0.05;
                // サイズが同じなので、当たり判定距離も赤玉と統一
                if (camera.position.distanceTo(boost.position) < 45) {
                    currentSpeed = BOOST_SPEED;
                    camera.fov = BOOST_FOV;
                    score += 50;
                    updateScore();
                    respawn(boost, 3500);
                } else if (camera.position.distanceTo(boost.position) > 4000) {
                    respawn(boost, 3000);
                }
            });

            renderer.render(scene, camera);
        }

        function updateScore() {
            document.getElementById('score-board').innerText = score.toString().padStart(5, '0');
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'flex';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
